<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helix Bank — Secure verification</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#0a1628; --panel:#132947; --line:rgba(255,255,255,0.08);
    --txt:#e8f0ff; --txt-dim:#8fa3c4; --txt-mute:#5a6b8a;
    --lime:#c6f24e; --lime-glow:rgba(198,242,78,0.35); --white:#fff;
  }
  html,body{height:100%;}
  body{
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--txt);
    min-height:100vh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased; letter-spacing:-0.01em;
  }
  .nav{padding:20px 40px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line);}
  .logo{display:flex; align-items:center; gap:11px; font-weight:800; font-size:18px;}
  .logo-mark{
    width:32px; height:32px; border-radius:9px;
    background:linear-gradient(135deg, var(--lime), #a8d63d);
    display:flex; align-items:center; justify-content:center;
    color:#0a1628; font-weight:900; font-size:15px;
    box-shadow:0 4px 16px var(--lime-glow);
  }
  .nav-list{display:flex; gap:32px; font-size:13.5px; color:var(--txt-dim); font-weight:500;}
  .nav-list a{color:inherit; text-decoration:none;}
  .nav-list a:hover{color:var(--txt);}
  .nav-cta{
    padding:10px 18px; font-family:'JetBrains Mono',monospace; font-size:12.5px;
    color:#0a1628; background:var(--lime); border-radius:8px;
    text-decoration:none; box-shadow:0 4px 14px var(--lime-glow);
  }
  .hero{
    flex:1; max-width:1240px; width:100%; margin:0 auto;
    padding:72px 40px 60px; display:grid; grid-template-columns:1.05fr 0.95fr;
    gap:70px; align-items:center;
  }
  .eyebrow{
    display:inline-block; font-family:'JetBrains Mono',monospace;
    font-size:11.5px; color:var(--lime); padding:6px 13px;
    background:rgba(198,242,78,0.08); border:1px solid rgba(198,242,78,0.2);
    border-radius:6px; margin-bottom:26px; letter-spacing:0.05em;
  }
  h1{font-size:52px; font-weight:800; line-height:1.05; letter-spacing:-0.035em; color:var(--white); margin-bottom:22px;}
  h1 .accent{color:var(--lime);}
  .lead{font-size:16.5px; line-height:1.65; color:var(--txt-dim); max-width:520px; margin-bottom:38px;}
  .actions{display:flex; gap:12px; flex-wrap:wrap;}
  .btn-primary{
    display:inline-flex; align-items:center; gap:10px;
    padding:15px 26px; font-family:'JetBrains Mono',monospace;
    font-size:13px; color:#0a1628; background:var(--lime);
    border-radius:9px; text-decoration:none;
    box-shadow:0 6px 20px var(--lime-glow);
  }
  .btn-primary:hover{transform:translateY(-2px); box-shadow:0 10px 28px var(--lime-glow);}
  .btn-outline{
    display:inline-flex; padding:15px 22px;
    font-family:'JetBrains Mono',monospace; font-size:13px;
    color:var(--txt); border:1px solid var(--line); border-radius:9px;
    text-decoration:none;
  }
  .features{
    margin-top:52px; padding-top:28px; border-top:1px solid var(--line);
    display:grid; grid-template-columns:repeat(3, 1fr); gap:26px;
  }
  .feature .t{font-size:13.5px; font-weight:600; margin-bottom:4px;}
  .feature .s{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--txt-mute);}
  .right-card{
    background:linear-gradient(180deg, var(--panel) 0%, #0f1f38 100%);
    border:1px solid var(--line); border-radius:18px; padding:28px;
    box-shadow:0 40px 80px rgba(0,0,0,0.4);
  }
  .card-header{
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:18px; border-bottom:1px solid var(--line); margin-bottom:20px;
  }
  .card-header
