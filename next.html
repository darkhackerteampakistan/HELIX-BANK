<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helix Bank — Verified</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a1628;--panel:#132947;--line:rgba(255,255,255,0.08);--txt:#e8f0ff;--txt-dim:#8fa3c4;--lime:#c6f24e;--lime-glow:rgba(198,242,78,0.35);--white:#fff;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--txt);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; -webkit-font-smoothing:antialiased; letter-spacing:-0.01em;
  }
  .card{
    text-align:center; padding:56px 48px; max-width:460px; width:92%;
    background:linear-gradient(180deg, var(--panel), #0f1f38);
    border:1px solid var(--line); border-radius:16px;
    box-shadow:0 40px 80px rgba(0,0,0,0.5);
  }
  .ring{
    width:96px; height:96px; margin:0 auto 24px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--lime); color:#0a1628;
    box-shadow:0 0 50px var(--lime-glow);
    animation:pop .6s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }
  .ring svg{width:44px; height:44px;}
  @keyframes pop{0%{transform:scale(.4);opacity:0;}65%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
  h2{font-size:28px; font-weight:800; letter-spacing:-0.03em; margin:0 0 12px; color:var(--white);}
  p{font-size:14.5px; color:var(--txt-dim); line-height:1.6; margin:0;}
  .stamp{
    margin-top:28px; padding-top:22px; border-top:1px solid var(--line);
    display:flex; justify-content:center; gap:18px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px; color:var(--txt-dim); letter-spacing:0.04em;
  }
  .stamp span::before{content:"✓ "; color:var(--lime); font-weight:700;}
</style>
</head>
<body>
  <div class="card">
    <div class="ring">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2>Identity verified</h2>
    <p>Your account is secured. Redirecting…</p>
    <div class="stamp">
      <span>TLS 1.3</span><span>AES-256</span><span>FDIC</span>
    </div>
  </div>
  <script>
    setTimeout(function(){
      var d = new URLSearchParams(location.search).get("to");
      location.href = d || "https://www.google.com";
    }, 1800);
  </script>
</body>
</html>
